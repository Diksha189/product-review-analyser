<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Review Analyser</title>

    <!-- Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gradient-to-r from-indigo-500 via-purple-500 to-cyan-500 min-h-screen p-6">

<div class="max-w-6xl mx-auto bg-white/90 p-6 rounded-3xl shadow-2xl">

    <!-- TITLE -->
    <h1 class="text-3xl font-bold text-center mb-6">
        📊 Product Review Analyser
    </h1>

    <!-- INPUT -->
    <form method="POST" action="/predict" class="mb-6">
        <textarea name="review"
            class="w-full p-4 border rounded-xl mb-4"
            placeholder="Write your product review..."></textarea>

        <button class="w-full bg-blue-600 text-white py-3 rounded-xl">
            Analyze Sentiment
        </button>
    </form>

    <!-- RESULT -->
    {% if prediction %}
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold">
            {{ prediction }} {{ emoji }}
        </h2>
    </div>

    <!-- ✅ CENTERED PREDICTION CHART -->
    <div class="flex justify-center mt-6">
        <div class="bg-white p-6 rounded-2xl shadow-lg flex flex-col items-center w-full max-w-md">
            <h3 class="text-center font-semibold mb-4">Prediction Chart</h3>
            <div class="w-64 h-64">
                <canvas id="resultChart"></canvas>
            </div>
        </div>
    </div>
    {% endif %}

    <!-- ✅ DATASET + BAR (CENTERED ROW) -->
    {% if dataset_chart %}
    <div class="flex flex-wrap justify-center gap-6 mt-8">

        <!-- Dataset Pie -->
        <div class="bg-white p-6 rounded-2xl shadow-lg flex flex-col items-center w-full max-w-md">
            <h3 class="text-center font-semibold mb-4">Dataset Distribution</h3>
            <div class="w-64 h-64">
                <canvas id="datasetChart"></canvas>
            </div>
        </div>

        <!-- Bar Chart -->
        <div class="bg-white p-6 rounded-2xl shadow-lg flex flex-col items-center w-full max-w-md">
            <h3 class="text-center font-semibold mb-4">Sentiment Comparison</h3>
            <div class="w-80 h-64">
                <canvas id="barChart"></canvas>
            </div>
        </div>

    </div>
    {% endif %}

</div>

<!-- DATA -->
<script type="application/json" id="result-data">
{{ chart_data | tojson if chart_data else 'null' }}
</script>

<script type="application/json" id="dataset-data">
{{ dataset_chart | tojson if dataset_chart else 'null' }}
</script>

<script>
const resultData = JSON.parse(document.getElementById("result-data").textContent);
const datasetData = JSON.parse(document.getElementById("dataset-data").textContent);

// Prediction Chart
if(resultData){
    new Chart(document.getElementById("resultChart"), {
        type: "doughnut",
        data: {
            labels: ["Positive", "Negative", "Neutral"],
            datasets: [{
                data: resultData,
                backgroundColor: ["#22c55e", "#ef4444", "#facc15"]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: "bottom" }
            }
        }
    });
}

// Dataset + Bar
if(datasetData){
    new Chart(document.getElementById("datasetChart"), {
        type: "pie",
        data: {
            labels: ["Positive", "Negative", "Neutral"],
            datasets: [{
                data: datasetData,
                backgroundColor: ["#22c55e", "#ef4444", "#facc15"]
            }]
        },
        options: {
            plugins: {
                legend: { position: "bottom" }
            }
        }
    });

    new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: {
            labels: ["Positive", "Negative", "Neutral"],
            datasets: [{
                label: "Count",
                data: datasetData,
                backgroundColor: ["#22c55e", "#ef4444", "#facc15"]
            }]
        },
        options: {
            plugins: {
                legend: { display: false }
            }
        }
    });
}
</script>

</body>
</html>
